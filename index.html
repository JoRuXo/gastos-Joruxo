<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#4F46E5">
  <meta name="robots" content="noindex">
  <title>Mis Gastos se ha mudado</title>
  <link rel="canonical" href="https://joruxo.github.io/gastos/">
  <!-- Red de seguridad: si el JavaScript falla, el navegador redirige a los 4 segundos -->
  <meta http-equiv="refresh" content="4; url=https://joruxo.github.io/gastos/">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Hanken+Grotesk:wght@400;600&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #FFFFFF; color: #111827; padding: 24px;
      font-family: 'Hanken Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .box {
      width: 100%; max-width: 360px; text-align: center;
      border: 1.5px solid #E5E7EB; border-top: 4px solid #4F46E5; border-radius: 20px;
      padding: 34px 26px 28px; box-shadow: 0 4px 20px rgba(0,0,0,.07);
    }
    .mark {
      width: 52px; height: 52px; border-radius: 16px; margin: 0 auto 18px;
      background: linear-gradient(150deg, #4F46E5, #4338CA);
      display: grid; place-items: center; font-size: 26px;
    }
    h1 { font-family: 'Fraunces', serif; font-weight: 600; font-size: 21px; margin-bottom: 10px; }
    p { font-size: 14px; line-height: 1.55; color: #6B7280; }
    .spin {
      width: 20px; height: 20px; margin: 20px auto 0;
      border: 2.5px solid rgba(79,70,229,.25); border-top-color: #4F46E5;
      border-radius: 50%; animation: s .7s linear infinite;
    }
    @keyframes s { to { transform: rotate(360deg); } }
    a.btn {
      display: block; margin-top: 20px; padding: 14px;
      background: #4F46E5; color: #fff; text-decoration: none;
      border-radius: 14px; font-weight: 600; font-size: 14.5px;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="mark">🌷</div>
    <h1>Mis Gastos se ha mudado</h1>
    <p>Ahora hay una sola app para todos. Te llevamos a la dirección nueva…</p>
    <div class="spin"></div>
    <a class="btn" href="https://joruxo.github.io/gastos/">Ir ahora</a>
    <p style="margin-top:16px;font-size:12.5px;color:#9CA3AF">
      Entra con tu email y contraseña de siempre. Tus datos están intactos.
    </p>
  </div>

  <script>
  (function () {
    "use strict";
    var DESTINO = "https://joruxo.github.io/gastos/";

    // Borra la copia vieja de la app que estaba guardada en el móvil/navegador,
    // y da de baja el service worker antiguo. Si no se hace, el icono ya
    // instalado podría seguir abriendo la versión vieja sin preguntar a internet.
    function limpiar() {
      var tareas = [];
      try {
        if ("serviceWorker" in navigator) {
          tareas.push(
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              return Promise.all(regs.map(function (r) { return r.unregister(); }));
            }).catch(function () {})
          );
        }
        if (window.caches && caches.keys) {
          tareas.push(
            caches.keys().then(function (claves) {
              return Promise.all(claves.map(function (k) { return caches.delete(k); }));
            }).catch(function () {})
          );
        }
      } catch (e) {}
      return Promise.all(tareas);
    }

    function irse() { location.replace(DESTINO); }

    // Da hasta 1,5 s para limpiar; pase lo que pase, redirige.
    Promise.race([
      limpiar(),
      new Promise(function (res) { setTimeout(res, 1500); })
    ]).then(irse, irse);
  })();
  </script>
</body>
</html>
